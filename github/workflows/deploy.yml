name: Deploy max-sports to Cloudflare Edge

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v392908e24e2463da921a6a386ef9b610aa61769 # v4.0.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Apply Remote D1 Migrations (DB)
        uses: cloudflare/wrangler-action@b9247d7c62d08a514d33924f0c406858a2d1d059 # v3.13.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote --env production

      - name: Publish max-sports to Cloudflare
        uses: cloudflare/wrangler-action@b9247d7c62d08a514d33924f0c406858a2d1d059 # v3.13.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production --minify
